<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cntnt Media System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #4a4a4a; /* Dark gray background */
            color: #ffffff;
            margin: 0;
            overflow: hidden; /* Prevent body scroll, handle inside containers */
        }

        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #3a3a3a;
        }
        ::-webkit-scrollbar-thumb {
            background: #6fa8dc;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #5b9bd5;
        }

        /* Custom UI classes based on mockups */
        .cntnt-logo {
            font-size: 3.5rem;
            line-height: 1;
            letter-spacing: -0.1em;
            color: #000;
            position: absolute;
            bottom: -5px;
        }
        
        .header-light-blue { background-color: #8bb2d9; }
        .header-dark-blue { background-color: #2a5d8c; }
        .card-blue { background-color: #63a0d4; transition: transform 0.2s, background-color 0.2s; }
        .card-blue:hover { transform: scale(1.02); background-color: #5b9bd5; cursor: pointer; }
        
        .tab-btn {
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-bottom: none;
            border-radius: 12px 12px 0 0;
            padding: 4px 32px;
            font-size: 1.1rem;
            color: white;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background-color: #2a5d8c;
            border-color: white;
        }
        .tab-btn:hover:not(.active) {
            background-color: rgba(255, 255, 255, 0.1);
        }

        /* Animations */
        .animate-fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Radio Button styling */
        .custom-radio {
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background-color: transparent;
            border: 4px solid #4a4a4a;
            box-shadow: 0 0 0 2px #63a0d4;
            display: inline-block;
            position: relative;
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
        }
        .custom-radio:checked {
            background-color: #63a0d4;
        }

        /* Fullscreen styles */
        #player-wrapper:fullscreen {
            border-radius: 0;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            aspect-ratio: auto !important;
        }
        #player-wrapper:-webkit-full-screen {
            border-radius: 0;
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
        }
        /* Custom YouTube-style player (manual merge mode) */
        .ytcp { font-family: 'Inter', sans-serif; }
        .ytcp-hidden { display: none !important; }
        .ytcp-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; z-index: 3; }
        .ytcp-bigplay { width: 80px; height: 80px; border-radius: 50%; background: rgba(0,0,0,.6); display: flex; align-items: center; justify-content: center; font-size: 32px; color: #fff; }
        .ytcp-error { background: rgba(0,0,0,.8); pointer-events: auto; flex-direction: column; gap: 14px; text-align: center; padding: 24px; z-index: 6; }
        .ytcp-error button { background: #63a0d4; color: #fff; padding: 8px 18px; border-radius: 8px; font-weight: 500; }
        .ytcp-error button:hover { background: #5b9bd5; }
        .ytcp-controls { position: absolute; left: 0; right: 0; bottom: 0; padding: 28px 12px 8px; background: linear-gradient(to top, rgba(0,0,0,.85), transparent); transition: opacity .25s; z-index: 5; }
        .ytcp.hide-controls .ytcp-controls { opacity: 0; pointer-events: none; }
        .ytcp.hide-controls { cursor: none; }
        .ytcp-progress { position: relative; height: 16px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
        .ytcp-track { position: relative; width: 100%; height: 4px; background: rgba(255,255,255,.3); border-radius: 2px; transition: height .1s; }
        .ytcp-progress:hover .ytcp-track, .ytcp-progress.dragging .ytcp-track { height: 6px; }
        .ytcp-buffered, .ytcp-played { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 2px; }
        .ytcp-buffered { background: rgba(255,255,255,.5); }
        .ytcp-played { background: #6fa8dc; }
        .ytcp-thumb { position: absolute; top: 50%; left: 0; width: 13px; height: 13px; margin-left: -6px; margin-top: -6.5px; border-radius: 50%; background: #6fa8dc; transform: scale(0); transition: transform .1s; pointer-events: none; }
        .ytcp-progress:hover .ytcp-thumb, .ytcp-progress.dragging .ytcp-thumb { transform: scale(1); }
        .ytcp-row { display: flex; align-items: center; gap: 8px; color: #fff; }
        .ytcp-btn { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; color: #fff; background: none; border: none; cursor: pointer; font-size: 17px; border-radius: 6px; }
        .ytcp-btn:hover { background: rgba(255,255,255,.15); }
        .ytcp-time { font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; margin-left: 4px; }
        .ytcp-badge { font-size: 11px; border: 1px solid rgba(255,255,255,.6); border-radius: 4px; padding: 0 5px; }
        .ytcp-vol { width: 70px; accent-color: #6fa8dc; cursor: pointer; }
        #yt-custom-player:fullscreen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
        #yt-custom-player:-webkit-full-screen { width: 100vw !important; height: 100vh !important; aspect-ratio: auto !important; }
    </style>
</head>

        function toggleAreaFullscreen() {
            const wrapper = document.getElementById('player-wrapper');
            const icon = document.getElementById('btn-maximize-icon');
            
            if (wrapper.classList.contains('fixed')) {
                wrapper.classList.remove('fixed', 'inset-0', 'z-[100]', 'rounded-none');
                wrapper.classList.add('relative', 'rounded-xl', 'aspect-video');
                icon.className = 'fa fa-window-maximize';
            } else {
                wrapper.classList.remove('relative', 'rounded-xl', 'aspect-video');
                wrapper.classList.add('fixed', 'inset-0', 'z-[100]', 'rounded-none');
                icon.className = 'fa fa-window-restore';
            }
        }

        function toggleFullscreen() {
            const elem = document.getElementById('player-wrapper');
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            const ampm = hours >= 12 ? 'pm' : 'am';
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock-display').innerText = `${hours}:${minutes} ${ampm}`;

        // --- Invidious instance discovery + resilient search ---
        const FALLBACK_INSTANCES = [
            'https://invidious.f5.si',
            'https://inv.nadeko.net',
            'https://yewtu.be',
            'https://invidious.nerdvpn.de',
            'https://invidious.privacyredirect.com'
        ];
        // Additional community instances (plain http / raw IPs; many may be offline at any given time)
        const EXTRA_INSTANCES = [
            'http://146.71.85.119:14120',
            'http://90.163.146.169:3001',
            'http://157.254.18.46:14120',
            'http://194.35.13.226:13000',

            u => `https://corsproxy.io/?url=${encodeURIComponent(u)}`,

        ];
        let instanceCache = null;

        function fetchJSON(url, timeoutMs = 7000) {
            const ctrl = new AbortController();
            const timer = setTimeout(() => ctrl.abort(), timeoutMs);
            return fetch(url, { signal: ctrl.signal })
                .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
                .finally(() => clearTimeout(timer));
        }

        // Ask the official instance directory for healthy instances that allow browser (CORS) API calls
        async function getInstances() {
            if (instanceCache) return instanceCache;
            let list = [];
            try {
                const data = await fetchJSON('https://api.invidious.io/instances.json?sort_by=type,health', 6000);
                list = data
                    .filter(([, info]) => info.api === true && info.cors === true && info.type === 'https')
                    .map(([, info]) => info.uri.replace(/\/$/, ''));
            } catch (e) {
                console.warn('Could not load instance list, using fallbacks', e);
            }
            instanceCache = [...new Set([...list.slice(0, 6), ...FALLBACK_INSTANCES])];
            return instanceCache;
        }

        async function searchInvidious(query) {
            const path = `/api/v1/search?q=${encodeURIComponent(query)}&type=video`;
            const primary = await getInstances();
            // Shuffle the extra instances so load is spread and dead ones don't always come first
            const extras = [...EXTRA_INSTANCES].sort(() => Math.random() - 0.5)
                .filter(u => !primary.includes(u));
            const all = [...primary, ...extras];

            const attempt = base => fetchJSON(base + path, 6000).then(data => {
                if (!Array.isArray(data)) throw new Error('Bad response');
                state.ytInstance = base;
                return data;
            });

            // 1) Race instances directly in batches of 6 (works when they send CORS headers)
            for (let i = 0; i < all.length; i += 6) {
                try {
                    return await Promise.any(all.slice(i, i + 6).map(attempt));
                } catch (e) { /* whole batch failed, try the next one */ }
            }
            console.warn('Direct instance requests failed, trying CORS proxies');

            // 2) Fall back to CORS proxies (the proxy makes the request, so browser CORS doesn't apply)
            const proxyAttempt = (base, proxy) => fetchJSON(proxy(base + path), 9000).then(data => {
                if (!Array.isArray(data)) throw new Error('Bad response');
                state.ytInstance = base;
                return data;
            });
            for (let i = 0; i < all.length; i += 4) {
                const batch = all.slice(i, i + 4).flatMap(b => CORS_PROXIES.map(px => proxyAttempt(b, px)));
                try {
                    return await Promise.any(batch);
                } catch (e) { /* next batch */ }
            }
            throw new Error('All Invidious instances failed');
        }

        async function handleSearch(e) {
            if (e.key === 'Enter') {
                const query = e.target.value.trim();
                state.searchQuery = query;
                
                if (state.activeTab === 'youtube') {
                    if (query) {
                        state.isLoading = true;
                        state.ytSearchTriggered = true;
                        state.view = 'grid';
                        render();

                        try {
                            const data = await searchInvidious(query);
                            
                            if (Array.isArray(data)) {
                                db.youtube = data.filter(item => item.type === 'video').map(v => ({
                                    id: v.videoId,
                                    title: v.title,
                                    description: v.author
                                }));
                            } else {

                            }
                            
                            if (db.youtube.length === 0) {
                                db.youtube = [{ id: 'error', title: 'No videos found.' }];
                            }
                        } catch (error) {
                            console.error("YouTube search failed:", error);
                            db.youtube = [{ id: 'error', title: 'Search failed. All Invidious instances are unreachable right now - try again in a moment.' }];
                        }
                        
                        state.isLoading = false;
                        render();
                    }
                } else if (state.activeTab !== 'browser') {
                    state.view = 'grid';
                    render();
                }
            }
        }

            state.activeTab = tabName;
            state.selectedItem = null;

            if (tabName === 'youtube') {
                state.view = state.ytSearchTriggered ? 'grid' : 'settings';

            } else {

            contentArea.innerHTML = `<div class="animate-fade-in w-full h-full">${html}</div>`;

        // --- Custom player for Manual merged mode ---
        // One controller drives a video-only and an audio-only element as if they were a single stream:
        //  - both are preloaded
        //  - they only start once BOTH have buffered the current position
        //  - play / pause / seek always apply to both together
        //  - if either one runs dry mid-playback, both pause until both have data again (like YouTube)

        let ytPlayerCleanup = null;
        let ytVolume = 1;
        let ytMuted = false;

        function attachManualSyncLogic() {
            const root = document.getElementById('yt-custom-player');
            const vid = document.getElementById('yt-dash-video');
            const aud = document.getElementById('yt-dash-audio');
            if (!root || !vid || !aud) return;

            const $ = id => document.getElementById(id);
            const ui = {
                spinner: $('ytcp-spinner'), bigplay: $('ytcp-bigplay'), bigplayIcon: $('ytcp-bigplay-icon'),
                error: $('ytcp-error'), errorMsg: $('ytcp-error-msg'), controls: $('ytcp-controls'),
                progress: $('ytcp-progress'), buffered: $('ytcp-buffered'), played: $('ytcp-played'), thumb: $('ytcp-thumb'),
                play: $('ytcp-play'), playIcon: $('ytcp-play-icon'), mute: $('ytcp-mute'), muteIcon: $('ytcp-mute-icon'),
                vol: $('ytcp-vol'), time: $('ytcp-time'), fs: $('ytcp-fs'), fsIcon: $('ytcp-fs-icon')
            };
            const HIDDEN = 'ytcp-hidden';
            const START_BUFFER = 2.0;   // seconds both streams must have buffered before (re)starting
            const openedAt = performance.now();

            let wantPlay = true;        // what the user wants (autoplay on open)
            let playing = false;        // both elements are actually running
            let starting = false;
            let ended = false;
            let dragging = false;
            let dragTime = 0;
            let failed = false;
            let destroyed = false;
            let overControls = false;
            let lastAlignVt = -1;
            let hideTimer = null;
            let clickTimer = null;

            vid.muted = true;           // the video stream has no sound; audio comes from the audio element

            // ----- helpers -----
            const fmt = s => {
                s = Math.max(0, Math.floor(s || 0));
                const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
                const pad = n => String(n).padStart(2, '0');
                return h ? `${h}:${pad(m)}:${pad(sec)}` : `${m}:${pad(sec)}`;
            };
            const getDuration = () => {
                const d = vid.duration;
                if (isFinite(d) && d > 0) return d;
                const a = aud.duration;
                return isFinite(a) && a > 0 ? a : 0;
            };
            const bufferedEnd = (m, t = m.currentTime) => {
                const b = m.buffered;
                for (let i = 0; i < b.length; i++) {
                    if (b.start(i) <= t + 0.25 && b.end(i) >= t) return b.end(i);
                }
                return t;
            };
            const ready = (m, need) => {
                const dur = getDuration();
                const left = dur ? dur - m.currentTime : Infinity;
                return m.readyState >= 3 && !m.seeking &&
                       bufferedEnd(m) - m.currentTime >= Math.min(need, Math.max(0, left - 0.1));
            };

            // ----- core sync -----
            function pauseBoth() {
                vid.pause();
                aud.pause();
                playing = false;
                aud.playbackRate = 1;
            }

            function startBoth() {
                starting = true;
                const p1 = vid.play();
                const p2 = aud.play();
                Promise.all([p1, p2]).then(() => {
                    if (wantPlay) playing = true; else pauseBoth();
                }).catch(err => {
                    pauseBoth();
                    if (err && err.name === 'NotAllowedError') wantPlay = false; // autoplay blocked: wait for a click
                }).finally(() => { starting = false; });
            }

            function seekTo(t) {
                const dur = getDuration();
                t = Math.max(0, Math.min(t, dur ? dur - 0.1 : t));
                ended = false;
                if (playing) pauseBoth();
                vid.currentTime = t;
                aud.currentTime = t;
                lastAlignVt = -1;
                showControls();
            }

            function togglePlay() {
                if (failed) return;
                if (ended) { ended = false; wantPlay = true; seekTo(0); }
                else if (wantPlay) { wantPlay = false; pauseBoth(); }
                else { wantPlay = true; }
                showControls();
                tick();
            }

            function fail(msg) {
                failed = true;
                wantPlay = false;
                pauseBoth();
                ui.errorMsg.textContent = msg;
                ui.error.classList.remove(HIDDEN);
                ui.spinner.classList.add(HIDDEN);
            }

            function tick() {
                if (destroyed || failed) return;
                const dur = getDuration();
                const vt = vid.currentTime;
                const nearEnd = dur && dur - vt < 0.4;

                if (wantPlay && !ended && !dragging) {
                    if (playing) {
                        if (!nearEnd && (vid.readyState < 3 || aud.readyState < 3)) {
                            // One of the two ran out of data: pause BOTH and wait for both to recover
                            pauseBoth();
                        } else if (!nearEnd) {
                            // Keep audio locked to the video
                            const drift = aud.currentTime - vt;
                            const abs = Math.abs(drift);
                            if (abs > 0.3) aud.currentTime = vt;
                            else if (abs > 0.06) aud.playbackRate = drift > 0 ? 0.95 : 1.05;
                            else if (aud.playbackRate !== 1) aud.playbackRate = 1;
                        }
                    } else if (!starting) {
                        if (Math.abs(aud.currentTime - vt) > 0.1 && lastAlignVt !== vt) {
                            aud.currentTime = vt;       // line the audio up, then wait for it to have data there
                            lastAlignVt = vt;
                        } else if (ready(vid, START_BUFFER) && ready(aud, START_BUFFER)) {
                            startBoth();
                        }
                    }
                }

                if (!playing && (vid.readyState === 0 || aud.readyState === 0) && performance.now() - openedAt > 25000) {
                    fail('This server is taking too long to send the 720p stream.');
                }
                updateUI(dur, vt);
            }

            function updateUI(dur, vt) {
                const cur = dragging ? dragTime : vt;
                const pct = dur ? Math.min(100, (cur / dur) * 100) : 0;
                ui.played.style.width = pct + '%';
                ui.thumb.style.left = pct + '%';
                const bEnd = Math.min(bufferedEnd(vid, vt), bufferedEnd(aud, vt));
                ui.buffered.style.width = (dur ? Math.min(100, Math.max((bEnd / dur) * 100, pct)) : 0) + '%';
                ui.time.textContent = fmt(cur) + ' / ' + fmt(dur);

                const buffering = wantPlay && !ended && !playing && !failed && !dragging;
                ui.spinner.classList.toggle(HIDDEN, !buffering);
                const showBig = (!wantPlay || ended) && !failed;
                ui.bigplay.classList.toggle(HIDDEN, !showBig);
                ui.bigplayIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : 'fa-play');
                ui.playIcon.className = 'fa ' + (ended ? 'fa-rotate-right' : wantPlay ? 'fa-pause' : 'fa-play');
            }

            // ----- volume -----
            function applyVolume() {
                aud.volume = ytVolume;
                aud.muted = ytMuted;
                ui.vol.value = ytMuted ? 0 : ytVolume;
                const icon = (ytMuted || ytVolume === 0) ? 'fa-volume-xmark' : ytVolume < 0.5 ? 'fa-volume-low' : 'fa-volume-high';
                ui.muteIcon.className = 'fa ' + icon;
            }
            function toggleMute() {
                ytMuted = !ytMuted;
                if (!ytMuted && ytVolume === 0) ytVolume = 0.5;
                applyVolume();
            }

            // ----- fullscreen -----
            function toggleFs() {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
                } else {
                    (root.requestFullscreen || root.webkitRequestFullscreen).call(root);
                }
            }
            const onFs = () => {
                const isFs = (document.fullscreenElement || document.webkitFullscreenElement) === root;
                ui.fsIcon.className = 'fa ' + (isFs ? 'fa-compress' : 'fa-expand');
            };

            // ----- controls visibility -----
            function showControls() {
                root.classList.remove('hide-controls');
                clearTimeout(hideTimer);
                hideTimer = setTimeout(() => {
                    if (wantPlay && !ended && !failed && !dragging && !overControls) root.classList.add('hide-controls');
                }, 2500);
            }

            // ----- events -----
            ui.play.addEventListener('click', togglePlay);
            ui.mute.addEventListener('click', toggleMute);
            ui.fs.addEventListener('click', toggleFs);
            ui.vol.addEventListener('input', () => {
                ytVolume = parseFloat(ui.vol.value);
                ytMuted = ytVolume === 0;
                applyVolume();
            });
            ui.vol.addEventListener('change', () => ui.vol.blur());

            vid.addEventListener('click', () => {
                clearTimeout(clickTimer);
                clickTimer = setTimeout(togglePlay, 220);
            });
            vid.addEventListener('dblclick', () => {
                clearTimeout(clickTimer);
                toggleFs();
            });

            vid.addEventListener('ended', () => { ended = true; wantPlay = false; pauseBoth(); showControls(); });
            const onMediaError = () => { if (!destroyed) fail("Couldn't load the 720p stream from this server."); };
            vid.addEventListener('error', onMediaError);
            aud.addEventListener('error', onMediaError);

            root.addEventListener('mousemove', showControls);
            root.addEventListener('touchstart', showControls, { passive: true });
            ui.controls.addEventListener('mouseenter', () => { overControls = true; });
            ui.controls.addEventListener('mouseleave', () => { overControls = false; showControls(); });

            // Seek bar (drag or click)
            const timeFromPointer = e => {
                const r = ui.progress.getBoundingClientRect();
                const x = Math.min(Math.max(e.clientX - r.left, 0), r.width);
                return (r.width ? x / r.width : 0) * getDuration();
            };
            ui.progress.addEventListener('pointerdown', e => {
                if (!getDuration() || failed) return;
                dragging = true;
                if (playing) pauseBoth();
                dragTime = timeFromPointer(e);
                ui.progress.setPointerCapture(e.pointerId);
                ui.progress.classList.add('dragging');
                updateUI(getDuration(), vid.currentTime);
            });
            ui.progress.addEventListener('pointermove', e => {
                if (dragging) { dragTime = timeFromPointer(e); updateUI(getDuration(), vid.currentTime); }
            });
            ui.progress.addEventListener('pointerup', e => {
                if (!dragging) return;
                dragging = false;
                ui.progress.classList.remove('dragging');
                seekTo(timeFromPointer(e));
            });
            ui.progress.addEventListener('pointercancel', () => {
                dragging = false;
                ui.progress.classList.remove('dragging');
            });

            // Keyboard shortcuts
            const onKey = e => {
                if (e.ctrlKey || e.metaKey || e.altKey) return;
                const tag = (e.target && e.target.tagName) || '';
                if (tag === 'INPUT' || tag === 'TEXTAREA') return;
                if (tag === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
                switch (e.key) {
                    case ' ': case 'k': e.preventDefault(); togglePlay(); break;
                    case 'ArrowLeft':   e.preventDefault(); seekTo(vid.currentTime - 5); break;
                    case 'ArrowRight':  e.preventDefault(); seekTo(vid.currentTime + 5); break;
                    case 'j': seekTo(vid.currentTime - 10); break;
                    case 'l': seekTo(vid.currentTime + 10); break;
                    case 'm': toggleMute(); break;
                    case 'f': toggleFs(); break;
                }
            };
            document.addEventListener('keydown', onKey);
            document.addEventListener('fullscreenchange', onFs);
            document.addEventListener('webkitfullscreenchange', onFs);

            // ----- go -----
            applyVolume();
            showControls();
            const interval = setInterval(tick, 120);
            tick();

            ytPlayerCleanup = () => {
                destroyed = true;
                clearInterval(interval);
                clearTimeout(hideTimer);
                clearTimeout(clickTimer);
                document.removeEventListener('keydown', onKey);
                document.removeEventListener('fullscreenchange', onFs);
                document.removeEventListener('webkitfullscreenchange', onFs);
            };
        }

        render();

    </script>
</body>
</html>
